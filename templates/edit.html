<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Todoの編集 | My todo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Quicksand:wght@600&family=Zen+Maru+Gothic:wght@400;700&display=swap">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <script src="{{ url_for('static', filename='script.js') }}" defer></script>
</head>
<body>
  <h1>Todoの編集</h1>

  <form class="add-form" method="post" action="{{ url_for('edit', todo_id=todo.id) }}">
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <label for="title">タイトル（必須）</label>
    <input id="title" name="title" value="{{ todo.title }}" required>
    <label for="content">内容</label>
    <textarea id="content" name="content" rows="3">{{ todo.content }}</textarea>
    <label for="due_date">期限</label>
    <input id="due_date" name="due_date" type="date" value="{{ todo.due_date }}">
    <button type="submit">保存</button>
  </form>

  <a href="{{ url_for('index') }}">一覧に戻る</a>
</body>
</html>
