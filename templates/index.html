<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Todoアプリ</title>
  <style>
    body { font-family: sans-serif; max-width: 720px; margin: 0 auto; padding: 16px; background: #f7f7f7; color: #222; }
    h1 { font-size: 1.5rem; }
    .todo { background: #fff; border-radius: 8px; padding: 12px 16px; margin-bottom: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
    .todo h2 { font-size: 1.1rem; margin: 0 0 4px; }
    .todo p { margin: 4px 0; white-space: pre-wrap; }
    .meta { font-size: .85rem; color: #666; }
    .empty { color: #666; }
  </style>
</head>
<body>
  <h1>Todo一覧</h1>

  {% if todos %}
    {% for todo in todos %}
      <div class="todo">
        <h2>{{ todo.title }}</h2>
        {% if todo.content %}<p>{{ todo.content }}</p>{% endif %}
        <div class="meta">
          {% if todo.due_date %}期限: {{ todo.due_date }}{% else %}期限なし{% endif %}
        </div>
      </div>
    {% endfor %}
  {% else %}
    <p class="empty">Todoはまだありません。</p>
  {% endif %}
</body>
</html>
