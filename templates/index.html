<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Todoアプリ</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <h1>Todo一覧</h1>

  <form class="add-form" method="post" action="{{ url_for('add') }}">
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <label for="title">タイトル（必須）</label>
    <input id="title" name="title" value="{{ form.title if form }}" required>
    <label for="content">内容</label>
    <textarea id="content" name="content" rows="3">{{ form.content if form }}</textarea>
    <label for="due_date">期限</label>
    <input id="due_date" name="due_date" type="date" value="{{ form.due_date if form }}">
    <button type="submit">追加</button>
  </form>

  {% if todos %}
    {% for todo in todos %}
      <div class="todo">
        <h2>{{ todo.title }}</h2>
        {% if todo.content %}<p>{{ todo.content }}</p>{% endif %}
        <div class="meta">
          <span>{% if todo.due_date %}期限: {{ todo.due_date }}{% else %}期限なし{% endif %}</span>
          <span class="actions">
            <a href="{{ url_for('edit', todo_id=todo.id) }}">編集</a>
            <form method="post" action="{{ url_for('delete', todo_id=todo.id) }}"
                  onsubmit='return confirm({{ ("「" ~ todo.title ~ "」を削除しますか？")|tojson }});'>
              <button type="submit" class="delete">削除</button>
            </form>
          </span>
        </div>
      </div>
    {% endfor %}
  {% else %}
    <p class="empty">Todoはまだありません。</p>
  {% endif %}
</body>
</html>
